name: Verify Mac Sync 2
# Mac 러너 시간을 아끼기 위해 main의 [verify-mac] 커밋이나 수동 실행에서만 돈다.
on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: mac-sync2-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  sync2:
    if: github.event.repository.private == false && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[verify-mac]'))
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      # Worker 검사(npm test)는 Linux의 Deploy/Studio workflow가 돈다. 여기서는 Mac 전용인 엔진 통합 검사와 빌드만 한다.
      - name: Sync 2 engine integration (local Worker)
        run: bash mac-sync2/test.command
      # 빌드 번호 = 이 workflow의 실행 번호. 앱 업데이트는 이 번호로 새 버전을 가린다.
      - name: Set build number
        run: /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" mac-sync2/Info.plist
      - name: Build Sync 2 app (10.13 target)
        run: bash mac-sync2/build.command
      - name: Package
        run: cd mac-sync2/build && ditto -c -k --keepParent "예배온 Sync 2.app" "YebaeOn-Sync-2.0.0.zip" && shasum -a 256 YebaeOn-Sync-2.0.0.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: YebaeOn-Sync-2.0.0
          path: mac-sync2/build/YebaeOn-Sync-2.0.0.zip
          retention-days: 30
      # 사용설명서 그림(Sync 2 창)을 로컬 Worker와 예시 자료로 찍는다. 실패해도 앱 검사·배포는 막지 않는다.
      - name: Manual screenshots (Sync 2 window)
        continue-on-error: true
        run: bash mac-sync2/capture.command build/manual-shots
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: manual-sync-shots
          path: mac-sync2/build/manual-shots
          if-no-files-found: ignore
          retention-days: 30
      # 같은 그림을 로그에도 base64로 남긴다(artifact 저장소에 닿지 않는 작업 환경에서 받기용).
      - name: Manual screenshots in the log
        if: always()
        continue-on-error: true
        run: for f in mac-sync2/build/manual-shots/*.png; do echo "SHOT-BEGIN $(basename "$f")"; base64 -i "$f" | tr -d '\n' | fold -w 4000; echo; echo "SHOT-END"; done
      # main 빌드만 서버(R2)에 올린다. 교회 Mac의 Sync 2가 [지금 설치]로 받는다. 작업 브랜치 빌드는 올리지 않는다.
      - name: Publish to the server (main only)
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUILD: ${{ github.run_number }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          ZIP=mac-sync2/build/YebaeOn-Sync-2.0.0.zip
          SHA=$(shasum -a 256 "$ZIP" | cut -d' ' -f1); SIZE=$(stat -f %z "$ZIP"); KEY="apps/sync2/YebaeOn-Sync-$BUILD.zip"
          npx wrangler r2 object put "pp6-library-files/$KEY" --file "$ZIP" --content-type application/zip --remote
          node -e 'const [b,s,z,k]=process.argv.slice(1);const n=(process.env.NOTES||"").split("\n")[0].replace(/\s*\[verify-mac\]\s*/,"").slice(0,200);process.stdout.write(JSON.stringify({build:+b,sha256:s,size:+z,key:k,notes:n,createdAt:new Date().toISOString()}))' "$BUILD" "$SHA" "$SIZE" "$KEY" > latest.json
          npx wrangler r2 object put "pp6-library-files/apps/sync2/latest.json" --file latest.json --content-type application/json --remote
          cat latest.json
