name: Verify Studio UX
on:
  push:
    branches: [studio-candidate]
  pull_request:
    paths: ['web-editor/**', 'cloudflare/**', 'tests/**', 'scripts/**', '.github/workflows/studio.yml']
permissions:
  contents: read
jobs:
  studio:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run deploy:check
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
        id: browser-setup
      - run: node tests/browser/studio.cjs
      - run: node tests/browser/library-management.cjs
      - run: node tests/browser/library-bins.cjs
      - run: node tests/browser/responsive.cjs
      - run: node tests/browser/bulletin.cjs
      - run: node tests/browser/media-lyrics.cjs
      - run: node tests/browser/ppt-import.cjs
        if: ${{ !cancelled() && steps.browser-setup.outcome == 'success' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-screenshots
          path: artifacts/
