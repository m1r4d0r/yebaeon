name: Verify Mac Sync
on:
  push:
    branches: [main]
    paths:
      - 'mac-sync/**'
      - 'mac-app/**'
      - 'cloudflare/**'
      - 'package.json'
      - 'package-lock.json'
      - '.node-version'
      - '.github/workflows/sync.yml'
      - '!**/*.md'
  pull_request:
    paths:
      - 'mac-sync/**'
      - 'mac-app/**'
      - 'cloudflare/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/sync.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-sync:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      - name: Build High Sierra target
        run: bash mac-sync/build-sync.command
      - name: Native safety and real Worker integration tests
        run: bash mac-sync/test-sync.command
      - name: Build integrated native app
        run: bash mac-app/build.command
      - name: Playlist, Core, GUI and app transport checks
        run: bash mac-app/test.command
      - name: Package app for church testing
        run: ditto -c -k --keepParent "mac-app/build/예배온 Sync.app" "mac-app/build/YebaeOn-Sync-macOS.zip"
      - name: Save tested app and synthetic UI previews
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: YebaeOn-Sync-macOS
          path: |
            mac-app/build/YebaeOn-Sync-macOS.zip
            mac-app/test-output/*.png
          retention-days: 14
          if-no-files-found: error
