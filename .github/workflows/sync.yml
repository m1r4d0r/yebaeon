name: Verify Mac Sync
# Mac builds consume the limited Actions allowance. Batch changes and run once
# for a release candidate; reuse its tested app and screenshots after merging.
on:
  workflow_dispatch:
  push:
    branches: [codex/sync-layout-pause]
concurrency:
  group: mac-sync-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  native-sync:
    if: github.event.repository.private == false && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[verify-mac]'))
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      - name: Build High Sierra target
        run: bash mac-sync/build-sync.command
      - name: Native safety and real Worker integration tests
        run: bash mac-sync/test-sync.command
      - name: Read-only diagnostic build and synthetic tests
        run: bash mac-app/diagnose-local.command --self-test
      - name: Build integrated native app
        run: bash mac-app/build.command
      - name: Playlist, Core, GUI and app transport checks
        run: bash mac-app/test.command
      - name: Save failure diagnostics without a new test run
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: YebaeOn-Sync-failure-previews
          path: mac-app/test-output/*.png
          retention-days: 3
          if-no-files-found: ignore
      - name: Package app for church testing
        run: ditto -c -k --keepParent "mac-app/build/예배온 Sync.app" "mac-app/build/YebaeOn-Sync-macOS.zip"
      - name: Save tested app and synthetic UI previews
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: YebaeOn-Sync-macOS
          path: |
            mac-app/build/YebaeOn-Sync-macOS.zip
            mac-app/test-output/*.png
          retention-days: 14
          if-no-files-found: error
