<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PP6 Document Diff Viewer</title>
<style>
:root{--bg:#edf1f5;--panel:#fff;--line:#d7dce3;--ink:#20242a;--muted:#6e7681;--green:#247d3b;--greenbg:#e9f7ec;--amber:#9b6a00;--amberbg:#fff3d6;--red:#b52a2a;--redbg:#fff0f0;--blue:#2868b2;--bluebg:#eef5ff;--gray:#66707c;--graybg:#f1f3f5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo",sans-serif;color:var(--ink)}
.wrap{max-width:1320px;margin:20px auto;padding:0 14px}.window{background:#f8f9fa;border:1px solid #bec5cd;border-radius:12px;overflow:hidden;box-shadow:0 18px 45px rgba(0,0,0,.12)}
.titlebar{height:42px;background:linear-gradient(#f2f2f2,#dedede);border-bottom:1px solid #c7c7c7;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;position:relative}.lights{position:absolute;left:14px;display:flex;gap:8px}.light{width:12px;height:12px;border-radius:50%}.r{background:#ff5f57}.y{background:#febc2e}.g{background:#28c840}
.header{padding:18px 20px;background:white;border-bottom:1px solid var(--line)}h1{font-size:22px;margin:0 0 6px}.sub{color:var(--muted);line-height:1.5}.filepick{margin-top:13px}.filepick input{max-width:100%}
.shell{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:650px}.sidebar{background:#f2f4f6;border-right:1px solid var(--line);padding:12px}.content{padding:16px 18px 26px;overflow:auto}.side-title{font-size:11px;color:#68717d;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin:6px 7px 9px}
.navbtn{width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:8px;padding:10px;margin-bottom:6px;cursor:pointer}.navbtn:hover{background:#fff}.navbtn.active{background:#fff;border-color:#bfcce0}.name{font-weight:700}.meta{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.35}
.pill{display:inline-block;border-radius:999px;padding:2px 7px;font-size:10px;font-weight:700;margin-right:4px;margin-top:6px}.add{background:var(--greenbg);color:var(--green)}.mod{background:var(--amberbg);color:var(--amber)}.del{background:var(--redbg);color:var(--red)}.move{background:var(--bluebg);color:var(--blue)}.tech{background:var(--graybg);color:var(--gray)}
.summary{display:grid;grid-template-columns:1.3fr repeat(5,1fr);gap:9px;margin-bottom:14px}.card{background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 12px;min-height:62px}.value{font-size:22px;font-weight:800}.label{font-size:11px;color:var(--muted);margin-top:5px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.toolbar h2{font-size:19px;margin:0}.toggle{font-size:12px;color:#58616c}
.group{border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:13px;overflow:hidden}.grouphead{padding:11px 13px;background:#f5f7f9;border-bottom:1px solid #e3e7ec;display:flex;justify-content:space-between;gap:10px}.grouphead b{font-size:14px}.groupbody{padding:12px}
.event{border:1px solid var(--line);border-left-width:4px;border-radius:9px;background:#fff;margin-bottom:10px;overflow:hidden}.event.modx{border-left-color:#dfb03e}.event.addx{border-left-color:#55a96b}.event.delx{border-left-color:#d95d5d}.event.techx{border-left-color:#98a1ac}.eventhead{padding:9px 11px;border-bottom:1px solid #eceff3;display:flex;justify-content:space-between;gap:10px;font-weight:700}.eventbody{padding:11px}.pos{font-size:11px;color:var(--muted);font-weight:400}.compare{display:grid;grid-template-columns:1fr 1fr;gap:9px}.box{border:1px solid var(--line);border-radius:7px;padding:9px;background:#fafafa;min-height:65px}.box.old{background:#fff7f7}.box.new{background:#f3fbf4}.boxlabel{font-size:10px;color:var(--muted);font-weight:700;margin-bottom:6px}.text{white-space:pre-wrap;line-height:1.45;font-size:15px}.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;word-break:break-all;line-height:1.45}
.list{list-style:none;margin:0;padding:0;border:1px solid #e1e5ea;border-radius:7px;overflow:hidden}.list li{padding:7px 9px;border-bottom:1px solid #eceff3;display:flex;gap:10px}.list li:last-child{border-bottom:0}.idx{width:65px;color:var(--muted);font-size:11px;flex:0 0 auto}.muted{color:var(--muted)}.empty{padding:46px 20px;text-align:center;color:var(--muted);background:white;border:1px dashed #ccd3dc;border-radius:10px}.note{background:#f3f7fc;border:1px solid #d9e2ef;border-radius:8px;padding:9px 11px;color:#526272;font-size:12px;line-height:1.55;margin-bottom:11px}.hidden{display:none!important}
.status-added{color:var(--green)}.status-modified{color:var(--amber)}.status-conflict{color:var(--red)}
@media(max-width:950px){.shell{grid-template-columns:1fr}.sidebar{border-right:0;border-bottom:1px solid var(--line)}.summary{grid-template-columns:repeat(3,1fr)}.compare{grid-template-columns:1fr}}
</style></head>
<body><div class="wrap"><div class="window">
<div class="titlebar"><div class="lights"><span class="light r"></span><span class="light y"></span><span class="light g"></span></div>PP6 Document Diff Viewer</div>
<div class="header"><h1>PP6 문서 변경 확인</h1><div class="sub">Mac 비교 엔진 또는 PC reference comparator가 만든 JSON을 읽어 변경 문서와 슬라이드 차이를 보여줍니다.</div><div class="filepick"><input id="file" type="file" accept=".json,application/json"></div></div>
<div class="shell"><aside class="sidebar"><div class="side-title">문서</div><div id="docs"><div class="empty">JSON을 선택하세요.</div></div></aside><main class="content" id="content"><div class="empty">비교 결과가 여기에 표시됩니다.</div></main></div>
</div></div>
<script>
let DATA=null,DOCS=[],selected=0,showTech=false;
const docsEl=document.getElementById('docs'),content=document.getElementById('content');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function pills(c){c=c||{};let s='';if(c.added)s+=`<span class="pill add">추가 ${c.added}</span>`;if(c.modified)s+=`<span class="pill mod">수정 ${c.modified}</span>`;if(c.deleted)s+=`<span class="pill del">삭제 ${c.deleted}</span>`;if(c.moved)s+=`<span class="pill move">이동 ${c.moved}</span>`;if(c.technical)s+=`<span class="pill tech">기술 ${c.technical}</span>`;return s}
function normalizeReport(d){
 if(Array.isArray(d.documents)) return d.documents.map(x=>({name:x.relativePath||x.incomingPath||'문서',status:x.status||'modified',diff:x.diff||null,dependencySummary:x.dependencySummary||{},raw:x}));
 if(d.groups && d.summary) return [{name:d.document||d.newFile||d.oldFile||'문서',status:'modified',diff:{oldSlides:d.oldSlides,newSlides:d.newSlides,counts:d.summary,groups:d.groups},dependencySummary:{},raw:d}];
 return [];
}
function renderDocs(){
 if(!DOCS.length){docsEl.innerHTML='<div class="empty">표시할 문서가 없습니다.</div>';return}
 docsEl.innerHTML=DOCS.map((d,i)=>{const c=d.diff?.counts||{};return `<button class="navbtn ${i===selected?'active':''}" data-i="${i}"><div class="name ${'status-'+d.status}">${esc(d.name)}</div><div class="meta">${esc(d.status)}</div>${d.diff?pills(c):''}</button>`}).join('');
 docsEl.querySelectorAll('button').forEach(b=>b.onclick=()=>{selected=+b.dataset.i;renderDocs();renderContent()});
}
function contiguous(items,key){if(!items?.length)return[];const arr=[...items].sort((a,b)=>(a[key]||0)-(b[key]||0)),groups=[];let g=[arr[0]];for(let i=1;i<arr.length;i++){if((arr[i][key]||0)===(arr[i-1][key]||0)+1)g.push(arr[i]);else{groups.push(g);g=[arr[i]]}}groups.push(g);return groups}
function slideTitle(e){return e.label||e.texts?.find(Boolean)||'(빈/무제 슬라이드)'}
function textChangeHtml(t){return `<div class="compare"><div class="box old"><div class="boxlabel">기존</div><div class="text">${esc(t.old??'(없음)')}</div></div><div class="box new"><div class="boxlabel">신규</div><div class="text">${esc(t.new??'(없음)')}</div></div></div>`}
function matchedEvents(g){
 let out='';for(const e of g.matched||[]){
  if(!e.modified && !(showTech&&e.technicalOnly) && !e.moved) continue;
  const d=e.detail||{};let body='';
  if(d.backgroundChanged) body+=`<div class="compare"><div class="box old"><div class="boxlabel">기존 배경</div><div class="code">${esc(d.oldBackground||'(없음)')}</div></div><div class="box new"><div class="boxlabel">신규 배경</div><div class="code">${esc(d.newBackground||'(없음)')}</div></div></div>`;
  for(const t of d.textChanges||[]) body+=`<div style="margin-top:9px">${textChangeHtml(t)}</div>`;
  if(d.mediaChanged) body+=`<div class="note" style="margin-top:9px">표시 미디어 구성 변경</div>`;
  if(d.layoutChanged && !d.backgroundChanged && !(d.textChanges||[]).length && !d.mediaChanged) body+=`<div class="note">레이아웃/스타일 값 변경</div>`;
  if(e.moved) body+=`<div class="note">의미 있는 순서 이동: ${e.oldIndex} → ${e.newIndex}</div>`;
  if(showTech && (e.technicalOnly || e.uuidChanged || (d.pathChanges||[]).length)){
    body+=`<div class="note"><b>기술적 차이</b>${e.uuidChanged?' · 내부 UUID 변경':''}</div>`;
    for(const p of d.pathChanges||[])body+=`<div class="box"><div class="boxlabel">${esc(p.basename)}</div><div class="code">기존: ${esc(p.old)}<br>신규: ${esc(p.new)}</div></div>`;
  }
  out+=`<div class="event ${e.modified?'modx':'techx'}"><div class="eventhead"><span>${e.modified?'수정':'기술'} · ${esc(e.label||'(슬라이드)')}</span><span class="pos">${e.oldIndex} → ${e.newIndex}</span></div><div class="eventbody">${body||'<span class="muted">세부 표시 변화 없음</span>'}</div></div>`;
 }
 return out;
}
function deletedEvents(g){let out='';for(const group of contiguous(g.deleted,'oldIndex')){const a=group[0].oldIndex,b=group[group.length-1].oldIndex;out+=`<div class="event delx"><div class="eventhead"><span>삭제 · ${group.length===1?esc(slideTitle(group[0])):`원본 슬라이드 ${a}–${b} · ${group.length}개`}</span><span class="pos">기존</span></div><div class="eventbody"><ul class="list">${group.map(x=>`<li><span class="idx">${x.oldIndex}</span><span>${esc(slideTitle(x))}</span></li>`).join('')}</ul></div></div>`}return out}
function addedEvents(g){let out='';for(const group of contiguous(g.added,'newIndex')){const a=group[0].newIndex,b=group[group.length-1].newIndex;out+=`<div class="event addx"><div class="eventhead"><span>추가 · ${group.length===1?esc(slideTitle(group[0])):`신규 슬라이드 ${a}–${b} · ${group.length}개`}</span><span class="pos">신규</span></div><div class="eventbody"><ul class="list">${group.map(x=>`<li><span class="idx">${x.newIndex}</span><span>${esc(slideTitle(x))}${x.texts?.length?`<div class="muted" style="white-space:pre-wrap">${esc(x.texts.filter(Boolean).join('\n'))}</div>`:''}</span></li>`).join('')}</ul></div></div>`}return out}
function renderContent(){
 const d=DOCS[selected];if(!d){content.innerHTML='<div class="empty">문서 없음</div>';return}
 if(d.status==='same'){content.innerHTML=`<div class="empty"><b>${esc(d.name)}</b><br>동일한 문서입니다.</div>`;return}
 if(d.status==='added'){content.innerHTML=`<div class="empty"><b>${esc(d.name)}</b><br>로컬에 없는 신규 문서입니다.</div>`;return}
 if(d.status==='conflict'){content.innerHTML=`<div class="empty"><b>${esc(d.name)}</b><br>동일한 정규화 경로 후보가 여러 개라 자동 비교를 중단했습니다.</div>`;return}
 const x=d.diff||{},c=x.counts||{};
 let groups='';for(const g of x.groups||[]){let events=matchedEvents(g)+deletedEvents(g)+addedEvents(g);if(!events)continue;groups+=`<section class="group"><div class="grouphead"><div><b>${esc(g.name||'그룹')}</b><div class="meta">원본 그룹 ${g.oldGroup} → 신규 그룹 ${g.newGroup}</div></div><div>${pills(g.counts)}</div></div><div class="groupbody">${events}</div></section>`}
 const deps=d.dependencySummary||{};const depIssues=(deps.missing||0)+(deps.ambiguous||0);const depNote=Object.keys(deps).length?`<div class="note">미디어 참조: ${Object.entries(deps).map(([k,v])=>`${esc(k)} ${v}`).join(' · ')}${depIssues?' · <b>확인 필요 있음</b>':''}</div>`:'';
 content.innerHTML=`<div class="toolbar"><div><h2>${esc(d.name)}</h2><div class="meta">${x.oldSlides??'?'} → ${x.newSlides??'?'} slides</div></div><label class="toggle"><input id="tech" type="checkbox" ${showTech?'checked':''}> 기술적 차이도 보기</label></div>
 <div class="summary"><div class="card"><div class="value">${x.oldSlides??'?'} → ${x.newSlides??'?'}</div><div class="label">전체 슬라이드</div></div><div class="card"><div class="value status-added">${c.added||0}</div><div class="label">추가</div></div><div class="card"><div class="value status-modified">${c.modified||0}</div><div class="label">수정</div></div><div class="card"><div class="value status-conflict">${c.deleted||0}</div><div class="label">삭제</div></div><div class="card"><div class="value">${c.moved||0}</div><div class="label">이동</div></div><div class="card"><div class="value">${c.technical||0}</div><div class="label">기술 차이</div></div></div>${depNote}${groups||'<div class="empty">표시할 내용 변경 없음</div>'}`;
 document.getElementById('tech').onchange=e=>{showTech=e.target.checked;renderContent()};
}
document.getElementById('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{DATA=JSON.parse(r.result);DOCS=normalizeReport(DATA);selected=0;renderDocs();renderContent()}catch(err){alert('JSON을 읽지 못했습니다: '+err.message)}};r.readAsText(f)};
</script></body></html>
